<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Collector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- JOIN SCREEN -->
  <section id="joinScreen" class="screen">
    <div class="card">
      <h1>Arena Collector</h1>
      <p class="subtitle">Введіть ім'я та приєднайтесь до лобі (2–4 гравці)</p>
      <input id="nameInput" maxlength="16" placeholder="Ваше ім'я" autocomplete="off">
      <button id="joinBtn">Приєднатись</button>
      <p id="joinError" class="error"></p>
    </div>
  </section>

  <!-- LOBBY SCREEN -->
  <section id="lobby" class="screen hidden">
    <div class="card lobby-card">
      <h2>Лобі</h2>
      <ul id="lobbyList"></ul>

      <!-- Class Selector -->
      <div id="classSelector" class="selector-group">
        <p class="selector-label">Оберіть клас:</p>
        <div id="classButtons" class="selector-buttons"></div>
      </div>

      <!-- Mode Selector (Leader Only) -->
      <div id="modeSelector" class="selector-group hidden">
        <p class="selector-label">Режим гри:</p>
        <div id="modeButtons" class="selector-buttons"></div>
      </div>

      <button id="startBtn" class="hidden">Почати гру (лідер)</button>
      <p id="lobbyHint" class="hint"></p>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="gameScreen" class="screen hidden">
    <header id="hud">
      <div id="scoreboard"></div>
      <div id="hudCenter">
        <span id="modeLabel" class="mode-badge"></span>
        <span id="timer">90</span>
      </div>
      <button id="menuBtn">☰ Меню</button>
    </header>

    <div id="arena">
      <!-- coins, powerups & players injected here as DOM elements -->
    </div>

    <div id="toast"></div>
  </section>

  <!-- MENU OVERLAY -->
  <div id="menuOverlay" class="overlay hidden">
    <div class="card">
      <h2>Меню</h2>
      <button id="pauseBtn">Пауза</button>
      <button id="resumeBtn">Продовжити</button>
      <button id="colorblindBtn" class="accessibility-toggle-btn">👁️ Режим для дальтоніків</button>
      <button id="quitBtn">Вийти в лобі</button>
      <button id="closeMenuBtn">Закрити</button>
    </div>
  </div>

  <!-- WINNER OVERLAY -->
  <div id="winnerOverlay" class="overlay hidden">
    <div class="card">
      <h2 id="winnerText"></h2>
      <button id="playAgainBtn">Грати ще раз (лідер)</button>
    </div>
  </div>

  <script src="client/dom.js"></script>
  <script src="client/audio.js"></script>
  <script src="client/input.js"></script>
  <script src="client/renderer.js"></script>
  <script src="client.js"></script>
</body>
</html>
